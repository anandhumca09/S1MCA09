<!DOCTYPE html>
<html lang="en">
<head>
<title>Bulb Turn On / Off</title>
<body>
<h1>Light Bulb ON / OFF</h1>
<img id="bulb" src="bulbOFF.png" alt="Light Bulb">
<br>
<button onclick="turnOn()">ON</button>
<button onclick="turnOff()">OFF</button>
<script>
function turnOn() {
document.getElementById("bulb").src = "bulbON.png";
}
function turnOff() {
document.getElementById("bulb").src = "bulbOFF.png";
}
</script>
<style>
img {
width: 200px;
height: 250px;
}
button {
padding: 10px 25px;
margin: 15px;
font-size: 18px;
cursor: pointer;
}
body {
padding: 10px 25px;
margin: 15px;
font-size: 18px;
cursor: pointer;
text-align: center;
}
</style>

</style>
</body>
</html>
