<html>
<head>
<title>Online Exam</title>
<style>
body {
font-family: Arial;
background: #eee;
padding: 30px;
}
.box {
background: white;
padding: 20px;
max-width: 500px;
margin: auto;
border-radius: 10px;
}
button {
background: blue;
color: white;
padding: 10px 20px;
border: none;
cursor: pointer;
}
</style>
</head>
<body>
<div class="box">
<h2>Online Examination</h2>
<p>1. What is HTML?</p>
<input type="radio" name="q1" value="1"> Hyper Text Markup Language<br>
<input type="radio" name="q1" value="0"> High Text Language<br>
<p>2. Which is used for styling web pages?</p>
<input type="radio" name="q2" value="1"> CSS<br>
<input type="radio" name="q2" value="0"> Java<br>
<p>3. Which language is used for web programming?</p>
<input type="radio" name="q3" value="1"> JavaScript<br>
<input type="radio" name="q3" value="0"> MS Word<br>
<br>
<button onclick="checkResult()">Submit Exam</button>
<h3 id="result"></h3>
</div>
<script>
function checkResult() {
let score = 0;
for(let i = 1; i <= 3; i++) {
let answer = document.querySelector('input[name="q' + i + '"]:checked');
if(answer && answer.value == "1") {
score++;
}
}
document.getElementById("result").innerHTML ="Your Score: " + score + " / 3";
}
</script>
</body>
</html>
