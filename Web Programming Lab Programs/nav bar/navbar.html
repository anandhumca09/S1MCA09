<!DOCTYPE html>
<html lang="en">
<head>
<title>Navigation Bar</title>
<style>
    .side {
        height: 100%;
        width: 160px;
        padding-top: 20px;
        background-color: green;
        position: fixed;
        top: 0;
        left: 0;
    }

    .side a {
        display: block;
        text-decoration: none;
        padding-right: 8px;
        padding-bottom: 8px;
        padding-left: 16px;
        color: white;
    }

    .side a:hover {
        color: red;
    }

    .main {
        margin-left: 160px;
        padding-top: 0px;
        padding-bottom: 0px;
        padding-right: 10px;
        padding-left: 10px;
        height: 2000px;
    }
</style>

</head>
<body>
<div class="side">
    <a href="#">About us</a>
    <a href="#">Department</a>
    <a href="#">Vision</a>
    <a href="#">Mission</a>
    <a href="#">Contact us</a>
</div>

<div class="main">
    <h1>Welcome</h1>
    <p>This is the main content area.</p>
</div>

</body>
</html>
